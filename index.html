<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel & Tour Prototype</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- QR Code Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    #map { height: 320px; width: 100%; border-radius: 12px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [tab, setTab] = useState('vault');
  const [gate, setGate] = useState('B22');
  const [terminal, setTerminal] = useState('4');
  const [alertMsg, setAlertMsg] = useState(null);

  // Expense tracker state
  const [expenses, setExpenses] = useState([
    { id: 1, desc: 'Airport Express Train', amountEur: 20, amountUsd: 21.60 },
    { id: 2, desc: 'Hotel Check-in Deposit', amountEur: 150, amountUsd: 162.00 }
  ]);
  const [newDesc, setNewDesc] = useState('');
  const [newEur, setNewEur] = useState('');

  // AI Planner state
  const [destination, setDestination] = useState('Paris, France');
  const [budget, setBudget] = useState('1500');
  const [days, setDays] = useState('3');
  const [loadingAi, setLoadingAi] = useState(false);
  const [itinerary, setItinerary] = useState(null);

  // QR Code generator ref
  const qrRef = useRef(null);

  useEffect(() => {
    if (tab === 'vault' && qrRef.current) {
      qrRef.current.innerHTML = '';
      new QRCode(qrRef.current, {
        text: `M1DOE/JOHN EDL1420 JFKCDG GATE-${gate} SEAT-12A`,
        width: 130,
        height: 130,
        colorDark: "#0f172a",
        colorLight: "#ffffff"
      });
    }
    if (tab === 'map') {
      setTimeout(() => initMap(), 100);
    }
  }, [tab, gate]);

  const initMap = () => {
    const mapContainer = document.getElementById('map');
    if (!mapContainer || mapContainer._leaflet_id) return;

    const map = L.map('map').setView([48.8566, 2.3522], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const pins = [
      { name: "Charles de Gaulle Airport (Arrival)", coords: [49.0097, 2.5479] },
      { name: "Hotel Le Marais", coords: [48.8575, 2.3622] },
      { name: "Eiffel Tower Tour", coords: [48.8584, 2.2945] },
      { name: "Louvre Museum", coords: [48.8606, 2.3376] }
    ];

    const latlngs = [];
    pins.forEach(pin => {
      L.marker(pin.coords).addTo(map).bindPopup(`<b>${pin.name}</b>`);
      latlngs.push(pin.coords);
    });

    L.polyline(latlngs, { color: '#0ea5e9', dashArray: '6, 6' }).addTo(map);
  };

  const simulateGateChange = () => {
    setGate('C14');
    setTerminal('2');
    setAlertMsg('Flight DL1420 Update: Gate changed to C14 (Terminal 2). Boarding in 25 min.');
    setTimeout(() => setAlertMsg(null), 8000);
  };

  const addExpense = (e) => {
    e.preventDefault();
    if (!newDesc || !newEur) return;
    const eur = parseFloat(newEur);
    const usd = eur * 1.08;
    setExpenses([{ id: Date.now(), desc: newDesc, amountEur: eur, amountUsd: usd }, ...expenses]);
    setNewDesc('');
    setNewEur('');
  };

  const handleGeneratePlan = () => {
    setLoadingAi(true);
    setTimeout(() => {
      setItinerary({
        destination,
        total: Math.round(budget * 0.88),
        days: [
          { day: 1, title: 'Historic Orientation & Welcome Dinner', cost: 140 },
          { day: 2, title: 'Iconic Landmarks & River Cruise', cost: 210 },
          { day: 3, title: 'Art Museums & Local Culinary Tour', cost: 180 }
        ]
      });
      setLoadingAi(false);
    }, 1200);
  };

  return (
    <div className="w-full sm:max-w-md bg-slate-950 border border-slate-800 sm:rounded-3xl shadow-2xl flex flex-col h-screen sm:h-[840px] overflow-hidden">
      
      {/* Top Status Bar */}
      <div className="bg-slate-900 px-6 py-3 border-b border-slate-800 flex items-center justify-between">
        <span className="text-xs font-semibold text-sky-400">TRAVEL & TOUR PROTOTYPE</span>
        <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full">Trial Active</span>
      </div>

      {/* Live Notification Banner */}
      {alertMsg && (
        <div className="bg-amber-500/20 border-b border-amber-500/50 p-3 flex items-start space-x-2 text-amber-200 text-xs">
          <span className="text-base">⚠️</span>
          <div>
            <p className="font-bold">Live Flight Alert (Simulated)</p>
            <p>{alertMsg}</p>
          </div>
        </div>
      )}

      {/* Main Content Area */}
      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        
        {/* TAB 1: OFFLINE VAULT */}
        {tab === 'vault' && (
          <div className="space-y-4">
            <div className="flex justify-between items-center">
              <h2 className="text-lg font-bold">Offline Travel Vault</h2>
              <button 
                onClick={simulateGateChange}
                className="text-xs bg-sky-600 hover:bg-sky-500 px-2.5 py-1.5 rounded-lg font-semibold shadow transition"
              >
                Simulate Gate Alert
              </button>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
              <div className="flex justify-between border-b border-slate-800 pb-3">
                <div>
                  <p className="text-xs text-slate-400">AIRLINE</p>
                  <p className="text-xl font-extrabold text-white">Delta Air Lines</p>
                </div>
                <div className="text-right">
                  <p className="text-xs text-slate-400">FLIGHT</p>
                  <p className="text-xl font-bold text-sky-400">DL1420</p>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 bg-slate-950 p-3 rounded-xl text-center border border-slate-800/80">
                <div>
                  <p className="text-[10px] text-slate-400">TERMINAL</p>
                  <p className="text-base font-bold text-white">{terminal}</p>
                </div>
                <div>
                  <p className="text-[10px] text-slate-400">GATE</p>
                  <p className="text-base font-bold text-amber-400">{gate}</p>
                </div>
                <div>
                  <p className="text-[10px] text-slate-400">SEAT</p>
                  <p className="text-base font-bold text-emerald-400">12A</p>
                </div>
              </div>

              <div className="flex justify-between text-xs text-slate-300">
                <div>
                  <p className="text-slate-500">PASSENGER</p>
                  <p className="font-semibold">John Doe</p>
                </div>
                <div className="text-right">
                  <p className="text-slate-500">BOOKING REF</p>
                  <p className="font-semibold">PNR-77X9Q</p>
                </div>
              </div>

              <div className="bg-white p-4 rounded-xl flex flex-col items-center justify-center">
                <div ref={qrRef}></div>
                <p className="text-slate-700 text-[11px] font-semibold mt-2">Verified Offline • Scan at Gate</p>
              </div>
            </div>
          </div>
        )}

        {/* TAB 2: INTERACTIVE MAP */}
        {tab === 'map' && (
          <div className="space-y-3">
            <h2 className="text-lg font-bold">Interactive Route & Map</h2>
            <div id="map" className="border border-slate-700"></div>
            <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
              <p className="font-bold text-sky-400">Day 1 Route Breakdown:</p>
              <p className="text-slate-300">• Stop 1: Charles de Gaulle Airport (Arrival)</p>
              <p className="text-slate-300">• Stop 2: Hotel Le Marais (Check-in)</p>
              <p className="text-slate-300">• Stop 3: Eiffel Tower & River Cruise</p>
            </div>
          </div>
        )}

        {/* TAB 3: AI PLANNER */}
        {tab === 'planner' && (
          <div className="space-y-4">
            <h2 className="text-lg font-bold">AI Itinerary Planner</h2>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
              <div>
                <label className="text-xs text-slate-400">Destination</label>
                <input 
                  type="text" 
                  value={destination} 
                  onChange={(e) => setDestination(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm mt-1 focus:outline-none focus:border-sky-500" 
                />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-slate-400">Budget ($)</label>
                  <input 
                    type="number" 
                    value={budget} 
                    onChange={(e) => setBudget(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm mt-1 focus:outline-none focus:border-sky-500" 
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Days</label>
                  <input 
                    type="number" 
                    value={days} 
                    onChange={(e) => setDays(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm mt-1 focus:outline-none focus:border-sky-500" 
                  />
                </div>
              </div>
              <button 
                onClick={handleGeneratePlan}
                disabled={loadingAi}
                className="w-full bg-sky-600 hover:bg-sky-500 py-2.5 rounded-lg text-sm font-bold shadow transition"
              >
                {loadingAi ? 'Architecting Plan...' : 'Generate Itinerary'}
              </button>
            </div>

            {itinerary && (
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-sky-400">{itinerary.destination}</h3>
                  <span className="text-xs bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800">
                    Est: ${itinerary.total} USD
                  </span>
                </div>
                {itinerary.days.map((d) => (
                  <div key={d.day} className="text-xs border-b border-slate-800/60 pb-2 flex justify-between">
                    <div>
                      <p className="font-bold text-slate-200">Day {d.day}</p>
                      <p className="text-slate-400">{d.title}</p>
                    </div>
                    <span className="text-emerald-400 font-semibold">${d.cost}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* TAB 4: BUDGET & FX */}
        {tab === 'budget' && (
          <div className="space-y-4">
            <h2 className="text-lg font-bold">Trip Budget & Currency</h2>
            
            <form onSubmit={addExpense} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
              <p className="text-xs text-sky-400 font-semibold">Live FX: 1 EUR ≈ 1.08 USD</p>
              <div className="flex gap-2">
                <input 
                  type="text" 
                  placeholder="Expense description" 
                  value={newDesc}
                  onChange={(e) => setNewDesc(e.target.value)}
                  className="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none"
                />
                <input 
                  type="number" 
                  placeholder="EUR" 
                  value={newEur}
                  onChange={(e) => setNewEur(e.target.value)}
                  className="w-20 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs focus:outline-none"
                />
              </div>
              <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-xs font-bold transition">
                Add Offline Expense
              </button>
            </form>

            <div className="space-y-2">
              <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Logged Expenses</p>
              {expenses.map((exp) => (
                <div key={exp.id} className="bg-slate-900 border border-slate-800/80 p-3 rounded-xl flex justify-between items-center text-xs">
                  <div>
                    <p className="font-semibold text-slate-200">{exp.desc}</p>
                    <p className="text-slate-500">{exp.amountEur} EUR</p>
                  </div>
                  <span className="font-bold text-emerald-400">${exp.amountUsd.toFixed(2)} USD</span>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>

      {/* Bottom Navigation Tabs */}
      <div className="bg-slate-900 border-t border-slate-800 grid grid-cols-4 py-2">
        <button 
          onClick={() => setTab('vault')}
          className={`flex flex-col items-center py-1 text-[11px] font-semibold ${tab === 'vault' ? 'text-sky-400' : 'text-slate-400 hover:text-slate-200'}`}
        >
          <span className="text-base mb-0.5">🎫</span>
          Vault
        </button>
        <button 
          onClick={() => setTab('map')}
          className={`flex flex-col items-center py-1 text-[11px] font-semibold ${tab === 'map' ? 'text-sky-400' : 'text-slate-400 hover:text-slate-200'}`}
        >
          <span className="text-base mb-0.5">🗺️</span>
          Map
        </button>
        <button 
          onClick={() => setTab('planner')}
          className={`flex flex-col items-center py-1 text-[11px] font-semibold ${tab === 'planner' ? 'text-sky-400' : 'text-slate-400 hover:text-slate-200'}`}
        >
          <span className="text-base mb-0.5">✨</span>
          AI Plan
        </button>
        <button 
          onClick={() => setTab('budget')}
          className={`flex flex-col items-center py-1 text-[11px] font-semibold ${tab === 'budget' ? 'text-sky-400' : 'text-slate-400 hover:text-slate-200'}`}
        >
          <span className="text-base mb-0.5">💳</span>
          Budget
        </button>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
    </html>
